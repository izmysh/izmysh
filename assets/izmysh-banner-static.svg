<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">IZMYSH — Small tools. Thoughtfully made.</title>
<desc id="desc">An acid-lime mouse with a dot eye and inner-ear curve, connected to a route. Static banner.</desc>
